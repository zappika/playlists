<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlists - Sarper Erel</title>
  <meta name="description" content="Monthly playlists by Sarper Erel." />
  <link rel="icon" href="/profile.png" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(0.17 0.004 90);      /* near-black, hair warm */
  --fg:oklch(0.95 0.004 90);      /* off-white  ~16:1 */
  --fg-mid:oklch(0.74 0.004 90);  /* secondary  ~8:1 */
  --fg-dim:oklch(0.64 0.004 90);  /* labels     ~5.6:1 */
  --border:oklch(0.28 0.004 90);
  --accent:var(--fg);             /* neutral: emphasis = full-strength text */
  --f:'Satoshi',system-ui,sans-serif;
  color-scheme:dark light;
}
@media (prefers-color-scheme:light){:root{
  --bg:oklch(0.993 0.001 250);  /* barely-off white */
  --fg:oklch(0.2 0 0);
  --fg-mid:oklch(0.42 0 0);
  --fg-dim:oklch(0.52 0 0);
  --border:oklch(0.9 0 0);
}}
html{font-size:87.5%;background:var(--bg);color:var(--fg)}  /* 14px root: every rem scales with it */
body{font-family:var(--f);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
.arrow{font-size:.85em}
.detail{color:var(--fg-mid)}
:root{--gut:clamp(1.25rem,8.333vw,10rem)}  /* one column of a 12-col grid in from each edge */

/* Top bar: name on the left, Barcelona now on the right */
.bar{position:fixed;inset:0 0 auto;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:1.25rem var(--gut) 1.5rem;background:linear-gradient(var(--bg) 60%,transparent)}
.now{display:flex;gap:.9rem;min-width:0;color:var(--fg-dim)}
#now-time{font-variant-numeric:tabular-nums;color:var(--fg)}
#now-song-row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now-song{color:var(--fg)}
/* Weather card on BCN hover: 3x2 grid, under 120px tall */
#now-bcn{position:relative;cursor:default;white-space:nowrap}
#wx{position:absolute;top:calc(100% + .9rem);right:0;display:grid;grid-template-columns:repeat(3,5.6rem);
  gap:1px;background:var(--border);border:1px solid var(--border);
  opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;pointer-events:none}
#wx>span{background:var(--bg);padding:.5rem .6rem .55rem;display:flex;flex-direction:column;gap:.15rem}
#wx i{font:normal .62rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg-dim);text-transform:lowercase}
#wx b{font-weight:500;font-size:.85rem;line-height:1.2;color:var(--fg);font-variant-numeric:tabular-nums}
#now-bcn:hover #wx,#now-bcn:focus #wx{opacity:1;transform:none}
#now-art{position:absolute;top:calc(100% - .5rem);right:var(--gut);width:120px;height:120px;object-fit:cover;
  opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s;pointer-events:none}
#now-song-row:hover #now-art{opacity:1;transform:none}
.name{font-size:1rem;font-weight:700;white-space:nowrap}
/* Name hover: email pill next to it, click to copy */
.who{position:relative;display:flex;align-items:center}
.mail{position:absolute;left:calc(100% + .75rem);top:50%;translate:0 -50%;display:flex;align-items:baseline;gap:.5rem;white-space:nowrap;
  font:500 1rem var(--f);color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:99rem;padding:.3rem .9rem;cursor:pointer;
  opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s;pointer-events:none}
.mail::before{content:'';position:absolute;inset:-1px 100% -1px -1rem}  /* hover bridge across the gap */
.mail small{font-size:.75rem;font-weight:400;color:var(--fg-dim)}
.who:hover .mail,.who:focus-within .mail{opacity:1;transform:none;pointer-events:auto}

/* Above the fold: about text, big, in the left half */
.about{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;gap:.6em;padding:6rem var(--gut) 12svh}
.about p{max-width:38rem;font-size:clamp(1.45rem,2.9vw,2.2rem);font-weight:500;line-height:1.15;letter-spacing:-.025em}

/* Numbered sections with a hairline on top */
section{margin:0 var(--gut);padding:1.25rem 0 6rem;border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(8,1fr);row-gap:3rem}
.label,.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;font-weight:400;color:var(--fg-dim)}
.label{grid-column:1/5}.num{grid-column:5/9;justify-self:end}
.list{grid-column:2/9;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1.6rem 2rem;font-size:1.15rem}
.period{display:block;font-size:.8rem;color:var(--fg-dim);font-variant-numeric:tabular-nums;margin-bottom:.15rem}
.list a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:.25em}
.list a:hover{text-decoration-color:var(--accent)}
p.detail{margin-top:.3rem;font-size:.95rem;max-width:30rem}
@media (max-width:640px){
  .list{grid-column:1/9;grid-template-columns:1fr}
  #now-song-label{display:none}
}

/* Playlist prototype: between Record Club and Are.na */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.page{padding:7rem var(--gut) 6rem}
.crumb{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;letter-spacing:-.025em;line-height:1.1}
.crumb a{color:var(--fg-dim)}.crumb a:hover{color:var(--fg)}
.crumb .sep{color:var(--border);margin:0 .4em;font-weight:400}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin:3rem 0 4.5rem;font-size:.95rem}
.info h3{font-size:.85rem;font-weight:400;color:var(--fg-dim);padding-bottom:.4rem;border-bottom:1px solid var(--border);margin-bottom:.7rem}
.kv{display:flex;justify-content:space-between;padding:.2rem 0}.kv span:first-child{color:var(--fg-mid)}
.links{display:flex;flex-direction:column;gap:.2rem}
.links a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:.25em}
.links a:hover{text-decoration-color:var(--fg)}
.head{display:grid;grid-template-columns:2.5rem 1fr 1fr;font:.75rem ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-dim);padding:0 0 .6rem;border-bottom:1px solid var(--border)}

.tracks{list-style:none}
.tracks li{display:grid;grid-template-columns:2.5rem 1fr 1fr;align-items:baseline;padding:.85rem 0;border-bottom:1px solid var(--border);font-size:1.05rem}
.tracks .n,.tracks time{color:var(--fg-dim);font-variant-numeric:tabular-nums;font-size:.95rem}
.tracks .a{color:var(--fg-mid)}
.tracks li:hover{background:color-mix(in oklch,var(--fg) 4%,transparent)}
.archive{margin-top:4.5rem}
.archive ul{list-style:none;display:flex;gap:1.6rem;font-size:1.15rem}
.archive a{color:var(--fg-mid)}.archive a:hover{color:var(--fg)}
/* 2610 hover: the other 2026 codes roll out underneath, drifting and faded */
.roll{position:relative;display:inline-block;cursor:ns-resize}
.reel{position:absolute;left:0;top:100%;display:flex;flex-direction:column;pointer-events:none;z-index:2}
.reel a{background:var(--bg);padding-right:.3em;color:var(--fg-dim);opacity:0;transform:translateY(-1.1em) skewX(-8deg);filter:blur(3px);
  transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1),filter .25s,color .1s;transition-delay:calc(var(--i)*35ms)}
.reel a:nth-child(1){--i:0}.reel a:nth-child(2){--i:1}.reel a:nth-child(3){--i:2}.reel a:nth-child(4){--i:3}.reel a:nth-child(5){--i:4}
.roll:hover .reel,.roll:focus-within .reel{pointer-events:auto}
.roll:hover .reel a,.roll:focus-within .reel a{opacity:calc(1 - var(--i)*.17);transform:translateX(calc(var(--i)*.35em));filter:none}
.reel a:hover{color:var(--fg);opacity:1!important}
.roll:hover .cur{color:var(--fg-dim)}
.roll:has(.reel a:hover) .cur{text-decoration:line-through;text-decoration-thickness:2px}
@media (max-width:640px){.info{grid-template-columns:1fr;gap:1.5rem}
  .head,.tracks li{grid-template-columns:2rem 1fr}.head .a{display:none}.tracks .a{grid-column:2;font-size:.9rem}}
.info[hidden],.head[hidden]{display:none}
</style>
</head>
<body>
  <header class="bar">
    <a class="name" href="/">Sarper Erel</a>
  </header>
  <main class="page">
    <h2 class="crumb"><a href="./">Playlists</a><span class="sep">/</span><span class="roll" tabindex="0" aria-label="Other playlists">
      <span class="cur" id="cur"></span>
      <span class="reel" id="reel"></span>
    </span></h2>

    <div class="info" id="info" hidden>
      <div>
        <h3>Info</h3>
        <div class="kv"><span>Month</span><span id="month"></span></div>
        <div class="kv"><span>Tracks</span><span id="count"></span></div>
      </div>
      <div>
        <h3>Listen</h3>
        <div class="links" id="listen"></div>
      </div>
      <div id="years-col">
        <h3>Other years</h3>
        <div class="links" id="years"></div>
      </div>
    </div>

    <div class="head" id="head" hidden><span>#</span><span>Track</span><span class="a">Artist</span></div>
    <ol class="tracks" id="tracks"></ol>
  </main>
  <script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const MONTHS = { JAN: 'January', FEB: 'February', MAR: 'March', APR: 'April', MAY: 'May', JUN: 'June', JUL: 'July', AUG: 'August', SEP: 'September', OCT: 'October', NOV: 'November', DEC: 'December' };
  const link = p => `./${p.title}`;

  // One playlist per page: /playlists/2604, newest at /playlists/
  fetch('./playlists.json').then(r => r.json()).then(all => {
    all.sort((a, b) => b.title.localeCompare(a.title));
    const want = location.pathname.match(/(\d{4})\/?$/)?.[1];
    const p = all.find(x => x.title === want) || all[0];
    document.title = `${p.title} - Sarper Erel`;

    $('cur').textContent = p.title;
    // Hover reel: the other playlists from the same year
    $('reel').innerHTML = all.filter(x => x.year === p.year && x !== p).slice(0, 8)
      .map((x, i) => `<a href="${link(x)}" style="--i:${i}">${x.title}</a>`).join('');

    $('month').textContent = `${MONTHS[p.month] ?? p.month} ${p.year}`;
    $('count').textContent = p.tracks.length;
    $('listen').innerHTML = [['Apple Music', p.appleUrl], ['Spotify', p.spotifyUrl]]
      .filter(([, u]) => u).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`).join('') || '<span>Soon</span>';

    // Other years: newest playlist of each other year
    const years = [...new Set(all.map(x => x.year))].filter(y => y !== p.year);
    if (years.length) $('years').innerHTML = years.map(y => `<a href="${link(all.find(x => x.year === y))}">${y}</a>`).join('');
    else $('years-col').style.visibility = 'hidden';

    $('tracks').innerHTML = p.tracks.map(t =>
      `<li><span class="n">${t.n}</span><span>${esc(t.title)}</span><span class="a">${esc(t.artist)}</span></li>`).join('');
    $('info').hidden = $('head').hidden = false;
  });
  </script>
</body>
</html>
